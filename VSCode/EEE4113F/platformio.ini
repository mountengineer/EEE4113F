board = adafruit_itsybitsy_m4
framework = arduino
lib_deps = 
	sparkfun/SparkFun LSM6DS3 Breakout@^1.0.3
	arduino-libraries/Arduino_LSM6DS3@^1.0.3
	arduino-libraries/SD@^1.3.0
	arduino-libraries/Arduino_CMSIS-DSP@^0.0.1
	paulstoffregen/Mahony@^1.2
